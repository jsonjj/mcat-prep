name: OIDC Test

# TEMPORARY diagnostic workflow to debug the GitHub OIDC -> AWS assume-role failure
# in the deploy pipeline. Prints the actual OIDC token sub/aud and tests the assume
# without the ~10min verify gate. Remove once the pipeline OIDC is confirmed working.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: aws-dev
    steps:
      - name: Show OIDC token sub/aud (what AWS evaluates)
        run: |
          set -euo pipefail
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64,json;s=sys.stdin.read().strip();s+='='*(-len(s)%4);c=json.loads(base64.urlsafe_b64decode(s));print('SUB=',c.get('sub'));print('AUD=',c.get('aud'));print('REPO=',c.get('repository'))"
      - name: Try assume role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::056956104102:role/mcat-github-deploy
          aws-region: us-east-1
      - name: Who am I
        run: aws sts get-caller-identity
